# Per-row test obligation overrides, read by gates/gen_req_gaps.py.
#
# The generator applies a default obligation to every `in` row (see the docstring of
# gates/gen_req_gaps.py). An override REPLACES the default `needs` for one row. Use it only
# where the default is clearly wrong, for example a definition or permission that no byte
# string can violate, so only acceptance is testable.
#
# Fields: id (an `in`, non-umbrella inventory row), needs (a subset of "accept", "reject",
# "prove", "review"), reason (not empty). Unknown ids, non-`in` rows, empty reasons and
# unknown roles are errors.

