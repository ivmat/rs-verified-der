[inventory]
id = "der-requirements"
title = "DER verified-core requirements tree"
source = "ITU-T X.690 (02/2021) text sha256 1678a1fb52b9f3919d54203e174f3c13114e425019518f096914cf3aeb515d54; ITU-T X.680 (02/2021) text sha256 f584f7d6fbd677318372aae753bbb8f5d1883b0590db62638532a3a756cb8dba; ITU-T X.501 (10/2019), Directory models specification (paraphrased title): PDF sha256 fa16c552c65a67ed0ab5be0291db368fc38ad94cb64df0bd90a9747586a3751b, extracted text sha256 274744507d7a2912823a6d4c1e6f06eec104fab1baa5c1e40ba5f8d496a3681e; X.501 Amendment 1 (10/2021) not checked because it is not available; X.501 Amendment 2 (10/2024), miscellaneous updates (paraphrased title): PDF sha256 084fbedc61083c3e5b2a0f6b6c5e44b62f6d1cf0ed1d93bb5ed59ac08fea5872, extracted text sha256 8a05da338a8dd60038e0138a70c1395c8fb6ea83715303a42dc13720111958d6; its changes to 9.2 and 9.3 are non-normative notes about moving types to UsefulDefinitions; carried rows from x690-der.clauses.toml sha256 512fcae2a6bf33725e21582b2bf3cd9e8ec1669ec7b7599d783ceeab6586b5ad. RFC 5280 (May 2008) sha256 a2f2628c0a83b873fc4786abd921f9b2c02395954b655d190bf16b831633345d; RFC 8017 (November 2016) sha256 1e72dc473d18df3fc5598cdc12795a9f18f36f1aef15abc23a55eb0d58151d11; RFC 5915 (June 2010) sha256 5c7b3b2eb449618a581a0ac89209d5d6acc7c375689b2e91304b5dcd866151dc; RFC 5208 (May 2008) sha256 89f7338cf546abaee1d14eef7357440f4fc45e579d47dd4b436c29533abafc2e; RFC 5958 (August 2010) sha256 82778b9ce7b34f02b5ae9777bfb9e42579744aebd2e1479f476513864525af67; RFC 3279 (April 2002) sha256 6d3f19f18e17fa1c68da5aaf4021327748fabca840d7300443b77357a1fc1614; RFC 5480 (March 2009) sha256 593bf29fd0da2ff8b903c3ebf1c9d189a770039159e2ba46a0c3b91355037f26; RFC 8410 (August 2018) sha256 90a0ff0b3dd661d3e26e1873f40f2ca8b41709a7bbd755a1ed3599c4746313d2; RFC 3629 (November 2003) sha256 a2a3a39457d30420c812f87a38cc2b9194832f6982ef17e619de7d816879d6a6; RFC 7468 (April 2015) sha256 0b2c3c2087cc0b099789c90e61c0208e87b25793f0ce40090979e8c734b3d989; RFC 4648 (October 2006) sha256 84e14418f795d503be5f34bf23ce4ebaa119e9ec7c9f667d8caeb111385b178f"
numbering = "Leaves use <SRC>-<clause>, letter suffixes for source lists, and -a/-b for further sentences; crate contracts use SAFE-, CODEC-, PROF-, and API- prefixes. SEC.* ids are inventory-only section groups. The side field records the actor named by the standard; a test obligation exists only when a listed module exposes a public API for that side, and S3 derives obligations from the intersection of side and public functions."

