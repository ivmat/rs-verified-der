[standard]
id = "asn1-selected-rules"
title = "X.690 (2021) DER requirements, with selected X.680 and RFC rows"
edition = "X690-2021 RFC5280 RFC7468 RFC4648"
provenance = "external"
slice = true
slice_note = "The census basis is every \"shall\" sentence of X.690 §8–§12; declarative rules without \"shall\" are not censused, with selected additions recorded separately. X.680 and RFC rows are retained selections without a census. Retained CER/BER legacy rows: X690-9 (CER context), X690-8.1.3.6.1 (BER indefinite-length octet), X690-8.1.1.2 (legacy primitive-layout title) and X690-8.1.1.3 (BER layout illustration). DER excludes indefinite lengths and constructed string forms by 10.1 and 10.2."
numbering = "the standard's own clause numbers"

