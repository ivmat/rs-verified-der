name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      run_kani: ${{ steps.scope.outputs.run_kani }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the CI proof tier
        id: scope
        shell: bash
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Selection-policy edits cannot judge their own eligibility to skip proofs.
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] ||
             [[ ! "$CI_BASE" =~ ^[0-9a-f]{40}$ ]] ||
             ! git merge-base --is-ancestor "$CI_BASE" HEAD ||
             ! git diff --quiet "$CI_BASE" HEAD -- gates/ci_changes.py .github/workflows/ci.yml; then
            echo "run_kani=true" >> "$GITHUB_OUTPUT"
            echo "Kani selected: push, unavailable history, or changed selection policy."
          else
            python3 gates/ci_changes.py
          fi

  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add clippy
        run: rustup component add clippy
      - name: Build
        run: cargo build --verbose
      - name: Fast checks (same entry point as local checks)
        run: sh check_fast.sh
      - name: Tier-parity gate (+ its self-test)
        run: |
          python3 gates/check_tier_parity.py --selftest
          python3 gates/check_tier_parity.py

  # `rust-version` was a declaration masquerading as a checked claim: it said 1.70 for the whole
  # life of the crate while the committed Cargo.lock (version 4) cannot even be PARSED by Cargo
  # 1.70. A published MSRV that is wrong is worse than none -- downstream users select on it.
  # This job builds and tests on exactly the declared version, so the manifest and reality cannot
  # drift apart again. Read the version out of the manifest rather than hardcoding it here, so
  # there is one source of truth: hardcoding would just create a second thing to drift.
  msrv:
    name: MSRV (builds + tests on the declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read declared MSRV from the manifest
        id: msrv
        run: |
          V=$(grep -m1 '^rust-version' der-verified/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          test -n "$V" || { echo "no rust-version in der-verified/Cargo.toml"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $V"
      # rust-toolchain.toml would otherwise override the choice, so install and select explicitly.
      - name: Install the declared toolchain
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - name: Build on the declared MSRV
        run: cargo "+${{ steps.msrv.outputs.version }}" build --verbose
      - name: Test on the declared MSRV
        run: cargo "+${{ steps.msrv.outputs.version }}" test --verbose

  # The Kani proof floor is SHARDED across runners by module. Two reasons:
  #  1. GitHub's standard runner has ~7 GB RAM. A single `cargo kani` run peaks well above
  #     that on the heaviest harnesses (see the heavy tier below), so it OOM-kills the job.
  #  2. Sharding also parallelises the multi-minute proof floor.
  # Each shard selects harnesses by fully-qualified-name substring (`--harness <module>::`).
  # This matrix covers the harnesses whose peak memory fits a 7 GB runner — the LIGHT tier in
  # gates/tiers.txt, gated by gates/check_tier_parity.py (no hardcoded count here: it drifts).
  # The heavy tier must be run locally via ./check.sh; this workflow records no current
  # heavy-tier result. See `kani-heavy` below and README.
  kani:
    needs: changes
    name: kani (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: codecs-a
            filters: >-
              --harness restricted_string:: --harness generalized_time::
              --harness utc_time:: --harness big_integer::
              --harness integer:: --harness length::
          - shard: codecs-b
            filters: >-
              --harness bit_string:: --harness tag:: --harness octet_string::
              --harness tlv:: --harness identifier_form:: --harness oid::
              --harness enumerated::
              --harness boolean:: --harness null:: --harness context_tag::
              --harness x509_algorithm_identifier:: --harness x509_spki::
              --harness x509_validity:: --harness ecdsa_sig_value::
              --harness profile::
          # The composite private-key container parsers are the heaviest-per-harness LIGHT modules
          # (they compose sequence + big_integer + algorithm_identifier + octet_string), so they get
          # their own shard to keep codecs-b's wall-clock down. Still LIGHT — check_tier_parity gates
          # that these four shards' union equals the LIGHT tier exactly. (`rsa_private_key` is HEAVY:
          # its member-walk harnesses peak near 9 GB.)
          - shard: private-keys
            filters: >-
              --harness ec_private_key:: --harness rsa_public_key::
              --harness pkcs8::
              --harness encrypted_private_key_info::
          - shard: utf8
            filters: "--harness utf8_string::"
    steps:
      - uses: actions/checkout@v4
      - name: Documentation-only PR (no proof run)
        if: needs.changes.outputs.run_kani == 'false'
        run: |
          echo "Kani NOT RUN (docs-only PR); no new proof result." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run Kani (${{ matrix.shard }})
        if: needs.changes.outputs.run_kani != 'false'
        uses: model-checking/kani-github-action@v1
        with:
          # Match the crate's pinned Kani (see PROOF_MANIFEST.md).
          kani-version: '0.67.0'
          args: "-Z stubbing ${{ matrix.filters }}"

  result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, test, msrv, kani]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_KANI: ${{ needs.changes.outputs.run_kani }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          if set(results) != {"changes", "test", "msrv", "kani"}:
              sys.exit("CI result is missing a dependency or has an unexpected dependency")
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              print("CI failed or did not complete: " + ", ".join(failed))
              sys.exit(1)
          mode = ("Kani NOT RUN (docs-only PR)" if os.environ.get("RUN_KANI") == "false"
                  else "CI LIGHT-tier Kani completed; heavy-tier Kani and Lean not run")
          message = "CI checks passed. " + mode + ". This is not a full-floor receipt."
          print(message)
          if summary := os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write(message + "\n")
          PYTHON

  # Heavy tier — proofs whose CBMC peak exceeds a 7 GB runner (measured on 16-core/29 GB):
  #   set_of::* , sequence::* , x509_certificate , x509_tbs_certificate , x509_extension (~20 GB),
  #   rsa_private_key (member-walk harnesses, ~9 GB),
  #   and x509_name (modular: validate_rdn lemma ~17 GB + a cheap validate_name stub — see DECISIONS.md
  #   D26; the monolithic proof was >100 GB, now split so both pieces fit a normal machine).
  # These are NOT run on GitHub's standard runners (they OOM). Run all of them locally with
  # ./check.sh; this workflow does not attest that a current local run exists.
  # To run them in CI, provide a large-memory runner (self-hosted or a GitHub larger runner, ~24 GB+)
  # and enable the job below.
  #
  # kani-heavy:
  #   name: kani (heavy, needs >=24 GB RAM)
  #   runs-on: [self-hosted, linux, x64]   # or a GitHub larger-runner label
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: model-checking/kani-github-action@v1
  #       with:
  #         kani-version: '0.67.0'
  #         args: >-
  #           -Z stubbing --harness set_of:: --harness sequence::
  #           --harness x509_name:: --harness x509_tbs_certificate::
  #           --harness x509_certificate:: --harness x509_extension::
  #           --harness rsa_private_key::
