name = "der-verified-lean"
defaultTargets = ["DerVerified"]

# The L4 "lid": we depend on Aeneas's Lean library (which transitively pulls
# mathlib @ v4.30.0-rc2). The local path reuses the installed Aeneas backend instead
# of cloning Aeneas. check_lean.sh creates this ignored link from VERIFIED_RS_TOOLS
# before invoking Lake, so the checkout itself can live at any filesystem depth.
[[require]]
name = "Aeneas"
path = ".lake/packages/Aeneas"

[[lean_lib]]
name = "DerVerified"
srcDir = "."
roots = ["DerLengthExtract", "LengthProofs", "DerBigintExtract", "BigIntProofs", "DerOidExtract", "OidProofs", "DerTlvExtract", "TlvProofs", "DerSequenceExtract", "SequenceProofs", "DerTagExtract", "TagProofs"]
