[[claim]]
id        = "PM/rsa_private_key"
clause    = "PM/rsa_private_key"
item      = "rsa_private_key"
statement = "PROOF_MANIFEST.md §5 properties of module `rsa_private_key` (5 Kani harness(es)): parse_never_panics, parse_strict_never_panics, parse_ok_2prime_witnessed, validate_other_prime_infos_never_panics, validate_other_prime_info_never_panics. §4 bounds: symbolic buffer 16..317, unwind 12..20, 4 kani::assume, 18 kani::cover, 4 stub application(s), 2 of 2 entry points named by a harness, Lean lid: no. §6.2 not proven: panic-freedom is proven **≤ 20 bytes** (`parse_never_panics`/`parse_strict_never_panics`); a real two-prime `RSAPrivateKey` is **~317 bytes** — panic-freedom beyond 20 bytes is **not machine-checked**: it rests on an un-machine-checked compositional argument (each field decoder proven panic-free on its own) plus a single concrete 317-byte fixture (`parse_ok_2prime_witnessed`) and `#[cfg(test)]` examples, not a symbolic proof over the real-size domain. No RSA arithmetic (`n = p*q`, CRT-parameter consistency, primality) is checked — every key-material INTEGER is opaque, comparison-only content"
