[[claim]]
id        = "PM/tlv"
clause    = "PM/tlv"
item      = "tlv"
statement = "PROOF_MANIFEST.md §5 properties of module `tlv` (5 Kani harness(es)): decode_tlv_never_panics, decode_tlv_structure, tlv_roundtrip_small, tlv_truncated_value_is_classified, strict_rejects_trailing. §4 bounds: symbolic buffer 3..16, unwind 16, 2 kani::assume, 3 kani::cover, 0 stub application(s), 3 of 3 entry points named by a harness, Lean lid: yes. §6.2 not proven: **no over-read is proven, and this row names it because nothing else in the module's own clause did**: an accepted TLV consumes `used ≤ input.len()` and its value borrow is exactly `input[header..used]` — Kani-bounded at a 16-byte buffer (`decode_tlv_structure`) *and* ∀-length in Lean (§3.2's `tlv` row). Not proven: the strict (anti-trailing-data) variant's rejection classification, which is Kani-bounded only. **Also not proven of `tlv`, deliberately:** any judgement that the parsed identifier is a *legal DER identifier for a value*. Since 2026-08-25 the primitive/constructed form rules and the EOC exclusion ARE decided by `identifier_form`, whose `decode_tlv_form_checked` composes them onto this reader; `decode_tlv` itself keeps its permissive framing-only behaviour by design, so the residual is live for its own callers (§6.3)"
grade     = "contract"
band      = "A3"
status    = "evidenced"
weight    = "weighted"
bounds    = "bounded: symbolic buffer 3..16, unwind 16 (§4). The manifest claims nothing about wider inputs at this clause; the ∀-length half of this codec is a separate clause (PM/lean-*)"
clause_source = "spec-document"
assumptions = ["A-2", "A-3", "A-5", "A-6", "A-12", "A-13", "A-16"]

