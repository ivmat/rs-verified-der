[package]
name = "der-verified"
version = "0.1.1"
edition = "2021"
# MEASURED, not declared. Was "1.70", which was false in two independent ways and had never
# been checked by anything: the committed `Cargo.lock` is version 4 (Cargo 1.70 refuses to parse
# it outright), and the `[lints]` table below is an unused manifest key before 1.74. Measured
# 2026-07-31 across installed toolchains:
#   1.70  -- FAILS: "lock file version 4 was found, but this version of Cargo does not understand"
#   1.78  -- builds, but `lints.rust.unexpected_cfgs.check-cfg` is an unused manifest key, so the
#            `cfg(kani)` registration is silently ignored and ordinary builds warn
#   1.80  -- clean: no warnings, 309 tests + 1 doc-test pass
# 1.80 is therefore the lowest version where the manifest is fully honoured. The CI `msrv` job
# gates this value, so it can no longer drift back into being an unchecked declaration.
rust-version = "1.80"
authors = ["Ivo Matijašević"]
readme = "README.md"
description = "DER (X.690) encoding/decoding, encoding layer only — under formal verification, with a per-claim assurance manifest."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ivmat/rs-verified-der"
keywords = ["der", "asn1", "x509", "formal-verification", "kani"]
categories = ["encoding", "parser-implementations"]
# The published .crate carries this crate's own acceptance manifest AND its evidence store, so a
# consumer who installed from the registry can check the claims without cloning the repository
# (owner ruling R-8, 2026-08-30 — "acceptance should be part of crate, that's the point of
# exposure"). `record` pointers in acceptance.toml are package-root-relative precisely so they
# still resolve inside an unpacked .crate.
#
# NOTE: specifying `include` REPLACES cargo's default file selection, so everything the package
# needs is listed explicitly here. `cargo package --list` is what verifies this list is complete
# — not this comment.
include = [
    "src/**/*.rs",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "acceptance.toml",
    "evidence/acceptance-records/*.json",
]

[dependencies]

# Register the `kani` cfg (set only under `cargo kani`) so ordinary builds don't warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
